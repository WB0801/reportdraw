<meta name="color-scheme" content="dark">

<style>
:root {
  --bg: #0d1723;
  --bg2: #16283a;
  --panel: rgba(255,255,255,.075);
  --panel-strong: rgba(255,255,255,.12);
  --line: rgba(255,255,255,.14);
  --text: #f7f2e9;
  --muted: #aebaca;
  --accent: #f2c66d;
  --accent2: #8ed6c3;
  --danger: #f09a96;
  --shadow: 0 28px 70px rgba(0,0,0,.32);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 13% 16%, rgba(142,214,195,.16), transparent 31rem),
    radial-gradient(circle at 88% 84%, rgba(242,198,109,.13), transparent 34rem),
    linear-gradient(150deg, var(--bg), var(--bg2));
  display: grid;
  place-items: center;
  padding: 20px;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image: linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: linear-gradient(to bottom, black, transparent 76%);
}
button { font: inherit; }
button:focus-visible { outline: 3px solid rgba(242,198,109,.72); outline-offset: 4px; }

.setup-screen {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: none;
  place-items: center;
  padding: 24px;
  background:
    radial-gradient(circle at 25% 20%, rgba(142,214,195,.16), transparent 28rem),
    radial-gradient(circle at 80% 80%, rgba(242,198,109,.14), transparent 30rem),
    rgba(9,17,26,.97);
}
.setup-screen.show { display: grid; }
.setup-card {
  width: min(620px, 100%);
  padding: clamp(28px, 5vw, 54px);
  border: 1px solid var(--line);
  border-radius: 30px;
  background: rgba(255,255,255,.075);
  box-shadow: var(--shadow);
  text-align: center;
  backdrop-filter: blur(16px);
}
.setup-kicker {
  color: var(--accent2);
  font-size: 13px;
  font-weight: 900;
  letter-spacing: .17em;
  text-transform: uppercase;
}
.setup-card h2 {
  margin: 10px 0 10px;
  font-size: clamp(34px, 6vw, 58px);
  letter-spacing: -.045em;
}
.setup-card p {
  margin: 0 auto;
  max-width: 470px;
  color: var(--muted);
  font-size: clamp(15px, 2vw, 19px);
  line-height: 1.6;
}
.group-count-box {
  margin: 32px auto 18px;
  display: flex;
  align-items: stretch;
  justify-content: center;
  gap: 10px;
  width: min(430px, 100%);
}
.group-count-input {
  width: 160px;
  min-height: 78px;
  border: 1px solid rgba(242,198,109,.38);
  border-radius: 20px;
  background: rgba(255,255,255,.075);
  color: var(--text);
  text-align: center;
  font: inherit;
  font-size: 34px;
  font-weight: 950;
  outline: none;
}
.group-count-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(242,198,109,.12);
}
.start-button {
  min-width: 190px;
  border: 0;
  border-radius: 20px;
  background: linear-gradient(135deg, #f5d789, var(--accent));
  color: #1f2832;
  font: inherit;
  font-size: 21px;
  font-weight: 950;
  cursor: pointer;
  box-shadow: 0 14px 36px rgba(242,198,109,.18);
}
.start-button:hover { filter: brightness(1.04); transform: translateY(-1px); }
.setup-error {
  min-height: 22px;
  margin-top: 4px;
  color: #ffd0cd;
  font-size: 14px;
  font-weight: 700;
}
.setup-hint {
  margin-top: 18px;
  color: #7f8da0;
  font-size: 13px;
}
@media (max-width: 560px) {
  .group-count-box { flex-direction: column; align-items: center; }
  .group-count-input, .start-button { width: 100%; }
  .start-button { min-height: 66px; }
}
.app {
  width: min(1180px, 100%);
  min-height: min(760px, calc(100vh - 40px));
  position: relative;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  gap: 18px;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}
.brand small {
  display: block;
  color: var(--accent2);
  text-transform: uppercase;
  letter-spacing: .18em;
  font-weight: 800;
  font-size: 12px;
  margin-bottom: 5px;
}
.brand h1 {
  margin: 0;
  font-size: clamp(26px, 3vw, 43px);
  letter-spacing: -.03em;
}
.top-actions { display: flex; gap: 9px; }
.ghost {
  border: 1px solid var(--line);
  background: rgba(255,255,255,.055);
  color: var(--text);
  min-height: 44px;
  padding: 0 15px;
  border-radius: 14px;
  cursor: pointer;
  transition: .18s ease;
}
.ghost:hover { background: rgba(255,255,255,.1); transform: translateY(-1px); }
.ghost.danger-armed { border-color: rgba(240,154,150,.55); color: #ffd3d0; background: rgba(240,154,150,.12); }
.progress {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
  gap: 8px;
}
.step {
  min-height: 58px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.045);
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 700;
  transition: .3s ease;
}
.step .dot {
  width: 22px; height: 22px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,.24);
  display: grid; place-items: center;
  font-size: 12px;
}
.step.current {
  color: var(--text);
  background: rgba(242,198,109,.11);
  border-color: rgba(242,198,109,.42);
  box-shadow: inset 0 0 0 1px rgba(242,198,109,.08);
}
.step.current .dot { border-color: var(--accent); color: var(--accent); }
.step.done { color: #dceee9; background: rgba(142,214,195,.095); border-color: rgba(142,214,195,.32); }
.step.done .dot { background: var(--accent2); color: #102428; border-color: transparent; }
.workspace {
  display: grid;
  grid-template-columns: 1.2fr .8fr;
  gap: 18px;
  min-height: 0;
}
.card {
  border: 1px solid var(--line);
  background: var(--panel);
  backdrop-filter: blur(14px);
  border-radius: 26px;
  box-shadow: var(--shadow);
}
.draw-card {
  min-height: 470px;
  display: grid;
  place-items: center;
  padding: 30px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.draw-card::after {
  content: "";
  position: absolute;
  width: 370px; height: 370px;
  border: 1px solid rgba(255,255,255,.06);
  border-radius: 50%;
  box-shadow: 0 0 0 74px rgba(255,255,255,.018), 0 0 0 148px rgba(255,255,255,.01);
  pointer-events: none;
}
.draw-inner { position: relative; z-index: 2; width: min(610px,100%); }
.eyebrow {
  font-size: clamp(17px,2vw,24px);
  color: var(--accent2);
  font-weight: 800;
  letter-spacing: .03em;
}
.prompt {
  margin: 8px 0 4px;
  font-size: clamp(34px,5vw,68px);
  font-weight: 900;
  letter-spacing: -.045em;
}
.subprompt { color: var(--muted); font-size: clamp(15px,1.6vw,20px); }
.draw-button {
  margin: 34px auto 18px;
  width: min(330px, 78vw);
  min-height: 88px;
  border: 0;
  border-radius: 24px;
  cursor: pointer;
  color: #1f2832;
  background: linear-gradient(135deg, #f5d789, var(--accent));
  box-shadow: 0 16px 42px rgba(242,198,109,.22), inset 0 1px 0 rgba(255,255,255,.72);
  font-size: clamp(24px,3vw,36px);
  font-weight: 950;
  letter-spacing: .06em;
  transition: transform .14s ease, filter .14s ease, opacity .14s ease;
}
.draw-button:hover { transform: translateY(-3px) scale(1.01); filter: brightness(1.04); }
.draw-button:active { transform: translateY(1px) scale(.99); }
.draw-button:disabled { cursor: default; opacity: .58; transform: none; }
.hint { color: #8190a1; font-size: 13px; }
.result-number {
  width: clamp(155px,21vw,245px);
  aspect-ratio: 1;
  margin: 26px auto 13px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 33% 25%, #fff5c9 0 8%, #f3cf78 36%, #dcae50 100%);
  color: #1d2832;
  font-size: clamp(88px,13vw,155px);
  font-weight: 950;
  line-height: 1;
  box-shadow: 0 22px 70px rgba(242,198,109,.31), inset 0 -12px 24px rgba(118,74,0,.12);
  transform: scale(.55) rotate(-8deg);
  opacity: 0;
}
.result-number.show { animation: reveal .55s cubic-bezier(.2,.95,.22,1.2) forwards; }
@keyframes reveal { to { transform: scale(1) rotate(0); opacity: 1; } }
.result-label { font-size: clamp(20px,2.2vw,28px); font-weight: 800; }
.result-label strong { color: var(--accent); }
.side-card {
  padding: 24px;
  display: grid;
  grid-template-rows: auto auto 1fr;
  gap: 22px;
  min-height: 0;
}
.section-title {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  margin-bottom: 11px;
}
.section-title h2 { margin: 0; font-size: 18px; }
.section-title span { color: var(--muted); font-size: 13px; }
.remaining { display: flex; flex-wrap: wrap; gap: 9px; }
.number-chip {
  width: 42px; height: 42px; border-radius: 12px;
  display: grid; place-items: center;
  background: rgba(255,255,255,.065);
  border: 1px solid rgba(255,255,255,.12);
  font-weight: 900;
}
.history-wrap { min-height: 0; }
.history { display: grid; gap: 7px; max-height: 350px; overflow: auto; padding-right: 4px; }
.history-row {
  min-height: 48px; padding: 0 14px; border-radius: 13px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: rgba(255,255,255,.045);
  border: 1px solid rgba(255,255,255,.075);
}
.history-row.empty { color: #718095; }
.history-row .group { font-weight: 800; }
.history-row .order { color: var(--accent); font-size: 22px; font-weight: 950; }
.history-row .order small { color: var(--muted); font-size: 12px; margin-left: 2px; }
.footer-note { color: #6f7f92; font-size: 12px; text-align: center; }
.final-screen {
  position: fixed; inset: 0; z-index: 40;
  display: none; place-items: center; padding: 25px;
  background: rgba(7,13,20,.93);
  backdrop-filter: blur(20px);
}
.final-screen.show { display: grid; animation: fadein .28s ease; }
@keyframes fadein { from { opacity: 0; } }
.final-content { width: min(1120px, 100%); text-align: center; }
.final-kicker { color: var(--accent2); letter-spacing: .2em; font-size: 12px; font-weight: 900; }
.final-content h2 { margin: 10px 0 6px; font-size: clamp(36px,6vw,74px); letter-spacing: -.05em; }
.final-desc { color: var(--muted); font-size: 17px; }
.sequence {
  margin: clamp(36px,6vh,68px) auto;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
  gap: clamp(10px,2vw,22px);
}
.seq-group {
  min-width: 120px; padding: 17px 20px;
  border-radius: 20px; border: 1px solid rgba(242,198,109,.3);
  background: rgba(242,198,109,.09);
  box-shadow: 0 14px 34px rgba(0,0,0,.18);
}
.seq-group .rank { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.seq-group .name { color: #fff1c7; font-size: clamp(21px,2.6vw,34px); font-weight: 950; }
.arrow { color: rgba(255,255,255,.28); font-size: 26px; }
.final-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
.confetti i {
  position: absolute; top: -20px; width: 8px; height: 15px;
  background: var(--accent); border-radius: 2px;
  animation: fall var(--t) linear forwards;
}
.confetti i:nth-child(3n) { background: var(--accent2); }
.confetti i:nth-child(4n) { background: #f09a96; }
@keyframes fall { to { transform: translateY(110vh) rotate(var(--r)); opacity: .9; } }
@media (max-width: 820px) {
  body { padding: 12px; }
  .app { min-height: auto; }
  .workspace { grid-template-columns: 1fr; }
  .draw-card { min-height: 430px; }
  .side-card { grid-template-rows: auto auto; }
  .history { max-height: none; }
  .topbar { align-items: flex-start; }
  .top-actions { flex-direction: column; }
}
@media (max-width: 520px) {
  .brand small { display: none; }
  .top-actions .ghost { padding: 0 11px; font-size: 13px; }
  .progress { grid-template-columns: repeat(2,1fr); }
  .draw-card { padding: 20px; }
  .arrow { display: none; }
}
</style>
</head>
<body>
<section class="setup-screen show" id="setupScreen" aria-modal="true" role="dialog" aria-labelledby="setupTitle">
  <div class="setup-card">
    <div class="setup-kicker">REPORT ORDER DRAW</div>
    <h2 id="setupTitle">今天有几组？</h2>
    <p>输入今天参与报告的组数。系统会自动生成相同数量的号码，每个号码只会被抽到一次。</p>
    <div class="group-count-box">
      <input class="group-count-input" id="groupCountInput" type="number" min="2" max="20" step="1" value="7" inputmode="numeric" aria-label="组数">
      <button class="start-button" id="startBtn" type="button">开始抽签</button>
    </div>
    <div class="setup-error" id="setupError" aria-live="polite"></div>
    <div class="setup-hint">支持 2–20 组 · 默认 7 组</div>
  </div>
</section>

<main class="app">
  <header class="topbar">
    <div class="brand">
      <small>Business Studies · Report Order Draw</small>
      <h1>商业学报告顺序抽签</h1>
    </div>
    <div class="top-actions">
      <button class="ghost" id="fullscreenBtn" type="button">⛶ 全屏</button>
      <button class="ghost" id="resetBtn" type="button">↺ 重新开始</button>
    </div>
  </header>

  <section class="progress" id="progress" aria-label="抽签进度"></section>

  <section class="workspace">
    <section class="card draw-card">
      <div class="draw-inner" id="drawInner"></div>
    </section>

    <aside class="card side-card">
      <section>
        <div class="section-title">
          <h2>剩余号码</h2>
          <span id="remainingCount">—</span>
        </div>
        <div class="remaining" id="remaining"></div>
      </section>
      <section class="history-wrap">
        <div class="section-title">
          <h2>抽签记录</h2>
          <span>组别 → 报告顺序</span>
        </div>
        <div class="history" id="history"></div>
      </section>
    </aside>
  </section>

  <div class="footer-note" id="footerNote">离线运行 · 不上传任何资料 · 号码不重复抽取</div>
</main>

<section class="final-screen" id="finalScreen" aria-modal="true" role="dialog" aria-labelledby="finalTitle">
  <div class="final-content">
    <div class="final-kicker">DRAW COMPLETE</div>
    <h2 id="finalTitle">报告顺序已确定</h2>
    <div class="final-desc">以下顺序由各组刚才抽到的号码决定</div>
    <div class="sequence" id="sequence"></div>
    <div class="final-actions">
      <button id="backBtn" class="ghost" type="button">查看抽签记录</button>
      <button id="finalResetBtn" class="ghost" type="button">重新抽签</button>
    </div>
  </div>
</section>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
(() => {
  'use strict';

  function parseGroupCount(value, min = 2, max = 20) {
    const text = value == null ? '' : String(value).trim();
    if (!/^\d+$/.test(text)) return null;
    const count = Number(text);
    if (!Number.isSafeInteger(count) || count < min || count > max) return null;
    return count;
  }

  function secureRandomIndex(length) {
    if (!Number.isInteger(length) || length <= 0) throw new RangeError('length must be a positive integer');
    const range = 0x100000000;
    const limit = Math.floor(range / length) * length;
    const buffer = new Uint32Array(1);
    let value;
    do {
      crypto.getRandomValues(buffer);
      value = buffer[0];
    } while (value >= limit);
    return value % length;
  }

  function createDrawSession(groupCount) {
    let pool = Array.from({ length: groupCount }, (_, i) => i + 1);
    let records = [];
    return {
      draw() {
        if (!pool.length) return null;
        const index = secureRandomIndex(pool.length);
        const [reportOrder] = pool.splice(index, 1);
        records.push({ group: records.length + 1, reportOrder });
        return reportOrder;
      },
      remaining: () => [...pool],
      history: () => records.map(r => ({...r})),
      reportSequence: () => [...records].sort((a,b) => a.reportOrder - b.reportOrder).map(r => r.group)
    };
  }

  const el = id => document.getElementById(id);
  const progress = el('progress');
  const remaining = el('remaining');
  const history = el('history');
  const drawInner = el('drawInner');
  const remainingCount = el('remainingCount');
  const finalScreen = el('finalScreen');
  const sequence = el('sequence');
  const confetti = el('confetti');
  const setupScreen = el('setupScreen');
  const groupCountInput = el('groupCountInput');
  const setupError = el('setupError');
  let session = null;
  let groupCount = null;
  let drawing = false;
  let resetArmed = false;
  let resetTimer = null;

  function drawButtonMarkup(group = 1) {
    return `
      <div class="eyebrow" id="eyebrow">现在轮到</div>
      <div class="prompt" id="prompt">第 ${group} 组组长</div>
      <div class="subprompt" id="subprompt">点击下方按钮，抽取你们的报告顺序</div>
      <button class="draw-button" id="drawBtn" type="button">🎲 抽签</button>
      <div class="hint">每个号码只会出现一次 · 使用浏览器安全随机数</div>`;
  }

  function bindDrawButton() {
    const btn = el('drawBtn');
    if (btn) btn.addEventListener('click', runDraw);
  }

  function renderProgress() {
    const count = session.history().length;
    progress.innerHTML = Array.from({ length: groupCount }, (_, i) => {
      const n = i + 1;
      const done = i < count;
      const current = i === count && count < groupCount;
      return `<div class="step ${done ? 'done' : current ? 'current' : ''}">
        <span class="dot">${done ? '✓' : n}</span><span>第 ${n} 组</span>
      </div>`;
    }).join('');
  }

  function renderRemaining() {
    const pool = session.remaining();
    remainingCount.textContent = `${pool.length} 个`;
    remaining.innerHTML = pool.length
      ? pool.map(n => `<span class="number-chip">${n}</span>`).join('')
      : '<span style="color:var(--muted)">已全部抽完</span>';
  }

  function renderHistory() {
    const records = session.history();
    history.innerHTML = Array.from({ length: groupCount }, (_, i) => {
      const r = records[i];
      return r
        ? `<div class="history-row"><span class="group">第 ${r.group} 组</span><span class="order">${r.reportOrder}<small>号</small></span></div>`
        : `<div class="history-row empty"><span class="group">第 ${i+1} 组</span><span>等待抽签</span></div>`;
    }).join('');
  }

  function renderAll() {
    renderProgress();
    renderRemaining();
    renderHistory();
    el('footerNote').textContent = `离线运行 · 不上传任何资料 · 1–${groupCount} 不重复抽取`;
  }

  function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

  async function runDraw() {
    if (!session || drawing || session.remaining().length === 0) return;
    drawing = true;
    const activeButton = el('drawBtn');
    if (activeButton) activeButton.disabled = true;
    const before = session.remaining();
    const group = session.history().length + 1;
    const result = session.draw();

    drawInner.innerHTML = `
      <div class="eyebrow">第 ${group} 组正在抽签</div>
      <div class="result-number show" id="rollingNumber">?</div>
      <div class="result-label" id="rollingLabel">号码飞舞中…</div>`;
    const rollingNumber = el('rollingNumber');
    const rollingLabel = el('rollingLabel');

    const start = performance.now();
    while (performance.now() - start < 850) {
      rollingNumber.textContent = before[secureRandomIndex(before.length)];
      await sleep(70 + Math.min(100, (performance.now() - start) / 8));
    }
    rollingNumber.classList.remove('show');
    void rollingNumber.offsetWidth;
    rollingNumber.textContent = result;
    rollingNumber.classList.add('show');
    rollingLabel.innerHTML = `你们的报告顺序是 <strong>第 ${result} 个</strong>`;

    renderProgress();
    renderRemaining();
    renderHistory();
    await sleep(1350);

    if (session.remaining().length === 0) {
      showFinal();
    } else {
      drawInner.innerHTML = drawButtonMarkup(group + 1);
      bindDrawButton();
    }
    drawing = false;
  }

  function showFinal() {
    const order = session.reportSequence();
    sequence.innerHTML = order.map((group, i) => {
      const arrow = i < order.length - 1 ? '<span class="arrow">→</span>' : '';
      return `<div class="seq-group"><div class="rank">第 ${i+1} 个报告</div><div class="name">第 ${group} 组</div></div>${arrow}`;
    }).join('');
    finalScreen.classList.add('show');
    launchConfetti();
  }

  function launchConfetti() {
    confetti.innerHTML = '';
    for (let i = 0; i < 52; i++) {
      const piece = document.createElement('i');
      piece.style.left = `${secureRandomIndex(10000) / 100}%`;
      piece.style.setProperty('--t', `${2.3 + secureRandomIndex(220) / 100}s`);
      piece.style.setProperty('--r', `${secureRandomIndex(360)}deg`);
      piece.style.animationDelay = `${secureRandomIndex(70) / 100}s`;
      confetti.appendChild(piece);
    }
    setTimeout(() => { confetti.innerHTML = ''; }, 4300);
  }

  function startSession() {
    const parsed = parseGroupCount(groupCountInput.value);
    if (parsed === null) {
      setupError.textContent = '请输入 2–20 之间的整数。';
      groupCountInput.focus();
      groupCountInput.select();
      return;
    }
    groupCount = parsed;
    session = createDrawSession(groupCount);
    drawing = false;
    setupError.textContent = '';
    setupScreen.classList.remove('show');
    finalScreen.classList.remove('show');
    confetti.innerHTML = '';
    drawInner.innerHTML = drawButtonMarkup(1);
    bindDrawButton();
    disarmReset();
    renderAll();
  }

  function returnToSetup() {
    session = null;
    groupCount = null;
    drawing = false;
    finalScreen.classList.remove('show');
    confetti.innerHTML = '';
    progress.innerHTML = '';
    remaining.innerHTML = '';
    history.innerHTML = '';
    remainingCount.textContent = '—';
    disarmReset();
    setupScreen.classList.add('show');
    setTimeout(() => {
      groupCountInput.focus();
      groupCountInput.select();
    }, 0);
  }

  function disarmReset() {
    resetArmed = false;
    clearTimeout(resetTimer);
    const btn = el('resetBtn');
    btn.textContent = '↺ 重新开始';
    btn.classList.remove('danger-armed');
  }

  function armReset() {
    if (drawing || !session) return;
    if (session.history().length === 0) { returnToSetup(); return; }
    const btn = el('resetBtn');
    if (resetArmed) { returnToSetup(); return; }
    resetArmed = true;
    btn.textContent = '确定清空？';
    btn.classList.add('danger-armed');
    resetTimer = setTimeout(disarmReset, 3200);
  }

  el('startBtn').addEventListener('click', startSession);
  groupCountInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') startSession();
  });
  groupCountInput.addEventListener('input', () => { setupError.textContent = ''; });
  el('resetBtn').addEventListener('click', armReset);
  el('backBtn').addEventListener('click', () => finalScreen.classList.remove('show'));
  el('finalResetBtn').addEventListener('click', returnToSetup);
  el('fullscreenBtn').addEventListener('click', async () => {
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch (_) {}
  });
  document.addEventListener('fullscreenchange', () => {
    el('fullscreenBtn').textContent = document.fullscreenElement ? '↙ 退出全屏' : '⛶ 全屏';
  });
  document.addEventListener('keydown', e => {
    if (!setupScreen.classList.contains('show') && (e.key === 'Enter' || e.key === ' ') && !finalScreen.classList.contains('show')) {
      const active = document.activeElement?.tagName;
      if (active !== 'BUTTON' && active !== 'INPUT') { e.preventDefault(); runDraw(); }
    }
    if (e.key === 'Escape' && finalScreen.classList.contains('show')) finalScreen.classList.remove('show');
  });

  setTimeout(() => {
    groupCountInput.focus();
    groupCountInput.select();
  }, 0);
})();
</script>
</body>
</html>
